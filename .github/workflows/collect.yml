name: Collect Tibo announcements
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tibo-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Collect announcements and record daily health
        env:
          COLLECTOR_SECRET: ${{ secrets.COLLECTOR_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://codex.yeartea.xyz/api/collect', {
            method: 'POST', headers: { Authorization: `Bearer ${process.env.COLLECTOR_SECRET}` },
            signal: AbortSignal.timeout(55000),
          });
          if (!response.ok) throw new Error(`Collector failed: HTTP ${response.status}`);
          const result = await response.json();
          if (!result.ok) throw new Error('Collector did not confirm success');
          console.log(JSON.stringify(result));
          const url = `https://api.github.com/repos/${process.env.GH_REPOSITORY}/contents/status.json`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const current = await fetch(url, { headers, signal: AbortSignal.timeout(10000) });
          if (current.status !== 404 && !current.ok) throw new Error(`Health read failed: ${current.status}`);
          const file = current.ok ? await current.json() : null;
          const old = file ? JSON.parse(Buffer.from(file.content, 'base64').toString()) : null;
          if (old?.collectedAt?.slice(0, 10) === result.collectedAt.slice(0, 10) && old.records === result.records && old.announcements === result.announcements) process.exit(0);
          const health = { collectedAt: result.collectedAt, records: result.records, announcements: result.announcements };
          const saved = await fetch(url, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: `Record collector health ${result.collectedAt.slice(0, 10)}`, content: Buffer.from(JSON.stringify(health, null, 2) + '\n').toString('base64'), ...(file ? { sha: file.sha } : {}) }), signal: AbortSignal.timeout(10000) });
          if (!saved.ok) throw new Error(`Health write failed: ${saved.status}`);
          JS
